<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer only ever needs its own bundle, the loopback API, artwork
      thumbnails, and the webfonts. Everything else is denied.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' data: https://fonts.gstatic.com;
               img-src 'self' data: blob: https:;
               media-src 'self' blob: http://127.0.0.1:* http://localhost:*;
               connect-src 'self' http://127.0.0.1:* http://localhost:* ws://localhost:* ws://127.0.0.1:*;
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <title>mixR</title>
    <meta name="description" content="Build a real, crossfaded DJ mix from songs you name, link, or drop in." />
  </head>
  <body data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
